<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留白 · 合成器</title>
<style>
  :root { color-scheme: dark; --bg: #17171a; --fg: #e9e6e0; --dim: #8d8a86; --line: #34343a; --accent: #e8a9a0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: minmax(0, 1fr) auto;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif;
  }
  .stage { min-height: 0; display: grid; place-items: center; padding: 20px 20px 10px; }
  canvas { display: block; max-width: 100%; max-height: 100%; background: #f4efe6; }
  .bar { padding: 6px 20px 16px; display: grid; gap: 8px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .row .grow { flex: 1; }
  .dim { color: var(--dim); }
  .num { font-variant-numeric: tabular-nums; }
  button {
    font: inherit; color: var(--fg); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 12px; min-width: 56px;
  }
  button:hover { border-color: var(--dim); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); }
  #marks { display: grid; color: var(--dim); font-size: 12px; }
  #marks span { border-left: 1px solid var(--line); padding-left: 6px; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
  <div class="stage"><canvas id="view" width="1920" height="1080"></canvas></div>
  <div class="bar">
    <div>
      <input id="scrub" type="range" min="0" max="48" value="0" aria-label="时间">
      <div id="marks"></div>
    </div>
    <div class="row">
      <button id="play" type="button">播放</button>
      <span id="time" class="num">0:00.00</span>
      <span id="shot"></span>
      <span class="grow"></span>
      <span id="note" class="dim"></span>
      <span id="status" class="dim"></span>
      <button id="export" type="button">导出 mp4</button>
    </div>
  </div>
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
